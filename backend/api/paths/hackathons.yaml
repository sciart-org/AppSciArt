    summary: Continue to next hackathon phase
    operationId: nextHackathonPhase
    parameters:
      - name: hackathonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: broadcast
        in: query
        required: false
        schema:
          type: boolean
    responses:
      "201":
        description: Continued to next phase
        content:
          application/json:
            schema:
              $ref: "../components/schemas/hackathon.yaml#/Hackathon"
      "401":
        $ref: "../components/responses.yaml#/UnauthorisedError"
      "403":
        description: Forbidden
      "404":
