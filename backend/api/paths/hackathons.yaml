    responses:
      "201":
        description: Participation created
  put:
    tags: [User Hackathons]
    summary: Update a participation
    operationId: updateParticipation
    parameters:
      - name: hackathonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: broadcast
        in: query
        required: false
        schema:
          type: boolean
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/hackathon.yaml#/ParticipationPut"
    responses:
      "200":
        description: Participation updated
      "401":
        $ref: "../components/responses.yaml#/UnauthorisedError"
      default:
        $ref: "../components/responses.yaml#/UnexpectedError"

