hackathons:
  x-router-controller: hackathonsController
  get:
    security: [{}]
    tags: [Hackathons]
    summary: Get hackathons
    operationId: getHackathons
    parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
          enum: [closest, incoming, previous, active]
    responses:
      "200":
        description: List of hackathons
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "../components/schemas/hackathon.yaml#/HackathonList"
                - $ref: "../components/schemas/hackathon.yaml#/Hackathon"
      default:
        $ref: "../components/responses.yaml#/UnexpectedError"
  post:
    tags: [Hackathons]
    summary: Create a new hackathon
    operationId: createHackathon
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/hackathon.yaml#/Hackathon"
    responses:
      "201":
        description: Hackathon created
        content:
          application/json:
            schema:
              $ref: "../components/schemas/hackathon.yaml#/Hackathon"
      "401":
        $ref: "../components/responses.yaml#/UnauthorisedError"
      default:
        $ref: "../components/responses.yaml#/UnexpectedError"

hackathonById:
  x-router-controller: hackathonsController
  get:
    tags: [Hackathons]
    summary: Get details of a hackathon
    operationId: getHackathonDetails
    parameters:
      - name: hackathonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: view
        in: query
        required: false
        schema:
          type: string
          enum: [full]
    responses:
      "200":
        description: Hackathon details
        content:
          application/json:
            schema:
              $ref: "../components/schemas/hackathon.yaml#/Hackathon"
      "401":
        $ref: "../components/responses.yaml#/UnauthorisedError"
      default:
        $ref: "../components/responses.yaml#/UnexpectedError"
  put:
    tags: [Hackathons]
    summary: Update a hackathon
    operationId: updateHackathon
    parameters:
      - name: hackathonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: broadcast
        in: query
        required: false
        schema:
          type: boolean
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/hackathon.yaml#/Hackathon"
    responses:
      "200":
        description: Hackathon updated
        content:
          application/json:
            schema:
              $ref: "../components/schemas/hackathon.yaml#/Hackathon"
      "401":
        $ref: "../components/responses.yaml#/UnauthorisedError"
      default:
        $ref: "../components/responses.yaml#/UnexpectedError"
  delete:
    tags: [Hackathons]
    summary: Delete a hackathon
    operationId: deleteHackathon
    parameters:
      - name: hackathonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Hackathon deleted

hackathonPublish:
  x-router-controller: hackathonsController
