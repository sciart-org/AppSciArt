participantsMe:
  x-router-controller: userHackathonsController
  get:
    tags: [User Hackathons]
    summary: Get current user's participation in a hackathon
    operationId: getMyHackathonParticipation
    parameters:
      - name: hackathonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Participation details
      "404":
        description: Resource not found
      default:
        description: Unexpected error
  post:
    tags: [User Hackathons]
    summary: Join the current user to a hackathon
    operationId: joinMeHackathon
    parameters:
      - name: hackathonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
