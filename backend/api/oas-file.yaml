openapi: 3.0.3
info:
  title: AppSciArt API
  version: 1.0.0
  description: API interactions required by AppSciArt platform.

security:
  - bearerAuth: []

tags:
  - name: Editions
    description: Edition-related endpoints
  - name: Hackathons
    description: Hackathon discovery, enrollment, and user participation
  - name: User Profile
    description: User info and settings
  - name: User Hackathons
    description: User participation and contributions in hackathons
  - name: User Preferences
    description: Liked items and personalized content
  - name: SciArt seeds
    description: Seed-related
  - name: SciArt flowers
    description: Flower-related
  - name: SciArt fruits
    description: Fruit-related
  - name: Auth
    description: Authentication endpoints
  - name: Groups & Teams
    description: Group and team management
  - name: Clusters
    description: Cluster management
  - name: Scientists
    description: Scientist-related endpoints
  - name: Static data
    description: Domain values and enumerations

paths:
  /health:
    x-router-controller: usersController
    get:
      security: [{}]
      summary: Health check endpoint
      operationId: getHealth
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /editions:
    $ref: "./paths/editions.yaml#/editions"
  /editions/{editionId}:
    $ref: "./paths/editions.yaml#/editionById"
  /editions/{editionId}/announce:
    $ref: "./paths/editions.yaml#/editionAnnounce"
  /editions/{editionId}/publish:
    $ref: "./paths/editions.yaml#/editionPublish"
  /editions/{editionId}/methodology:
    $ref: "./paths/editions.yaml#/editionMethodology"
  /editions/{editionId}/scientists:
    $ref: "./paths/editions.yaml#/editionScientists"

  /hackathons:
    $ref: "./paths/hackathons.yaml#/hackathons"
  /hackathons/{hackathonId}:
    $ref: "./paths/hackathons.yaml#/hackathonById"
  /hackathons/{hackathonId}/next-phase:
    $ref: "./paths/hackathons.yaml#/hackathonNextPhase"
  /hackathons/{hackathonId}/publish:
    $ref: "./paths/hackathons.yaml#/hackathonPublish"
  /hackathons/{hackathonId}/users:
    $ref: "./paths/hackathons.yaml#/hackathonUsers"
  /hackathons/{hackathonId}/participants/me:
    $ref: "./paths/hackathons.yaml#/participantsMe"
  /hackathons/{hackathonId}/evaluators/me:
    $ref: "./paths/hackathons.yaml#/evaluatorsMe"
  /hackathons/{hackathonId}/participants/{userId}:
    $ref: "./paths/hackathons.yaml#/participantsByUser"
  /hackathons/{hackathonId}/clusters:
    $ref: "./paths/hackathons.yaml#/hackathonClusters"
  /hackathons/{hackathonId}/clusters/{clusterNumber}:
    $ref: "./paths/hackathons.yaml#/hackathonClusterByNumber"
  /hackathons/{hackathonId}/clusters/{clusterNumber}/exploring-groups:
    $ref: "./paths/hackathons.yaml#/exploringGroups"
  /hackathons/{hackathonId}/clusters/{clusterNumber}/exploring-groups/{groupNumber}:
    $ref: "./paths/hackathons.yaml#/exploringGroupByNumber"
  /hackathons/{hackathonId}/clusters/{clusterNumber}/co-creation-teams:
    $ref: "./paths/hackathons.yaml#/coCreationTeams"
  /hackathons/{hackathonId}/clusters/{clusterNumber}/co-creation-teams/{teamNumber}:
    $ref: "./paths/hackathons.yaml#/coCreationTeamByNumber"

  /exploring-groups/{groupId}/conceptual-map:
    $ref: "./paths/hackathons.yaml#/conceptualMap"
  /exploring-groups/{groupId}/conceptual-map/submit:
    $ref: "./paths/hackathons.yaml#/conceptualMapSubmit"
  /exploring-groups/{groupId}/conceptual-map/reopen:
    $ref: "./paths/hackathons.yaml#/conceptualMapReopen"

  /co-creation-teams/{teamId}/flower/submit:
    $ref: "./paths/hackathons.yaml#/flowerSubmit"
  /co-creation-teams/{teamId}/flower/reopen:
    $ref: "./paths/hackathons.yaml#/flowerReopen"

  /users:
    $ref: "./paths/users.yaml#/users"
  /users/{userId}:
    $ref: "./paths/users.yaml#/userById"
  /users/{userId}/liked-seeds:
    $ref: "./paths/users.yaml#/userLikedSeeds"
  /users/{userId}/liked-seeds/{seedId}:
    $ref: "./paths/users.yaml#/userLikedSeedById"
  /users/{userId}/hackathons:
    $ref: "./paths/users.yaml#/userHackathons"
  /users/{userId}/hackathons/{hackathonId}/contributions:
    $ref: "./paths/users.yaml#/userHackathonContributions"
  /users/{userId}/hackathons/{hackathonId}/clusters/{clusterNumber}:
    $ref: "./paths/users.yaml#/userHackathonCluster"
  /me:
    $ref: "./paths/users.yaml#/me"

  /login:
    $ref: "./paths/auth.yaml#/login"
  /register:
    $ref: "./paths/auth.yaml#/register"
  /register/complete:
    $ref: "./paths/auth.yaml#/registerComplete"
  /early-signups/{earlySignupId}:
    $ref: "./paths/auth.yaml#/earlySignup"

  /seeds:
    $ref: "./paths/seeds.yaml#/seeds"
  /seeds/{seedId}:
    $ref: "./paths/seeds.yaml#/seedById"
  /seeds/{seedId}/publish:
    $ref: "./paths/seeds.yaml#/seedPublish"
  /seeds/{seedId}/conceptual-maps:
    $ref: "./paths/seeds.yaml#/seedConceptualMaps"

  /flowers:
    $ref: "./paths/flowers.yaml#/flowers"
  /flowers/{flowerId}:
    $ref: "./paths/flowers.yaml#/flowerById"
  /flowers/{flowerId}/publish:
    $ref: "./paths/flowers.yaml#/flowerPublish"

  /fruits:
    $ref: "./paths/fruits.yaml#/fruits"
  /fruits/{fruitId}:
    $ref: "./paths/fruits.yaml#/fruitById"
  /fruits/{fruitId}/publish:
    $ref: "./paths/fruits.yaml#/fruitPublish"

  /scientists:
    $ref: "./paths/scientists.yaml#/scientists"
  /scientists/me/editions:
    $ref: "./paths/scientists.yaml#/scientistMeEditions"
  /scientists/{scientistId}/editions:
    $ref: "./paths/scientists.yaml#/scientistEditions"
  /scientists/me/editions/{editionId}/seeds:
    $ref: "./paths/scientists.yaml#/scientistMeEditionSeeds"

  /areas-of-interest:
    $ref: "./paths/domain.yaml#/areasOfInterest"
  /affiliations:
    $ref: "./paths/domain.yaml#/affiliations"
  /hackathon-roles:
    $ref: "./paths/domain.yaml#/hackathonRoles"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    UnexpectedError:
      $ref: "./components/responses.yaml#/UnexpectedError"
    UnauthorisedError:
      $ref: "./components/responses.yaml#/UnauthorisedError"
  schemas:
    EditionDetails:
      $ref: "./components/schemas/edition.yaml#/EditionDetails"
    EditionSummary:
      $ref: "./components/schemas/edition.yaml#/EditionSummary"
    EditionList:
      $ref: "./components/schemas/edition.yaml#/EditionList"
    Methodology:
      $ref: "./components/schemas/edition.yaml#/Methodology"
    Hackathon:
      $ref: "./components/schemas/hackathon.yaml#/Hackathon"
    HackathonList:
      $ref: "./components/schemas/hackathon.yaml#/HackathonList"
    HackathonJoinRequest:
      $ref: "./components/schemas/hackathon.yaml#/HackathonJoinRequest"
    UserDetails:
      $ref: "./components/schemas/user.yaml#/UserDetails"
    UserList:
      $ref: "./components/schemas/user.yaml#/UserList"
    SeedDetails:
      $ref: "./components/schemas/seed.yaml#/SeedDetails"
    SeedList:
      $ref: "./components/schemas/seed.yaml#/SeedList"
    FlowerDetails:
      $ref: "./components/schemas/flower.yaml#/FlowerDetails"
    FlowerList:
      $ref: "./components/schemas/flower.yaml#/FlowerList"
    FruitDetails:
      $ref: "./components/schemas/fruit.yaml#/FruitDetails"
    FruitList:
      $ref: "./components/schemas/fruit.yaml#/FruitList"
    GroupDetails:
      $ref: "./components/schemas/group.yaml#/GroupDetails"
    NewGroup:
      $ref: "./components/schemas/group.yaml#/NewGroup"
    GroupList:
      $ref: "./components/schemas/group.yaml#/GroupList"
    TeamDetails:
      $ref: "./components/schemas/group.yaml#/TeamDetails"
    TeamList:
      $ref: "./components/schemas/group.yaml#/TeamList"
    Cluster:
      $ref: "./components/schemas/cluster.yaml#/Cluster"
    ClusterList:
      $ref: "./components/schemas/cluster.yaml#/ClusterList"
    Contribution:
      $ref: "./components/schemas/common.yaml#/Contribution"
    ConceptualMap:
      $ref: "./components/schemas/common.yaml#/ConceptualMap"
    DomainItem:
      $ref: "./components/schemas/common.yaml#/DomainItem"
    DomainItemList:
      $ref: "./components/schemas/common.yaml#/DomainItemList"
    ErrorResponse:
      $ref: "./components/schemas/common.yaml#/ErrorResponse"
    SignUpRequest:
      $ref: "./components/schemas/auth.yaml#/SignUpRequest"
    QuickSignUpRequest:
      $ref: "./components/schemas/auth.yaml#/QuickSignUpRequest"
    CompleteSignUpRequest:
      $ref: "./components/schemas/auth.yaml#/CompleteSignUpRequest"
    SignInRequest:
      $ref: "./components/schemas/auth.yaml#/SignInRequest"
