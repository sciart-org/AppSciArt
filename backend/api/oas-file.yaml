openapi: 3.0.3
info:
  title: AppSciArt API
  version: 1.0.0
  description: API interactions required by AppSciArt platform.
security:
  - bearerAuth: []
tags:
  - name: Editions
    description: Edition-related endpoints
  - name: Hackathons
    description: Hackathon discovery, enrollment, and user participation
  - name: User Profile
    description: User info and settings
  - name: User Hackathons
    description: User participation and contributions in hackathons
  - name: User Preferences
    description: Liked items and personalized content
  - name: SciArt seeds
    description: Seed-related
  - name: SciArt flowers
    description: Flower-related
  - name: SciArt fruits
    description: Fruit-related
  - name: Auth
    description: Authentication endpoints
  - name: Groups & Teams
    description: Group and team management
  - name: Clusters
    description: Cluster management

paths:
  /editions:
    x-router-controller: editionsController
    get:
      security: [{}]
      tags: [Editions]
      summary: Get editions
      operationId: getEditions
      parameters:
        - name: visibility
          in: query
          required: true
          schema:
            type: string
            enum: [all, published]
          description: Filter editions by visibility status
      responses:
        "200":
          description: A list of editions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditionList"
    post:
      tags: [Editions]
      summary: Create an edition
      operationId: createEdition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditionDetails"
      responses:
        "201":
          description: Edition created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditionDetails"

  /editions/{editionId}:
    x-router-controller: editionsController
    get:
      tags: [Editions]
      summary: Get details of an edition
      operationId: getEditionDetails
      parameters:
        - name: editionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Edition details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditionDetails"
    put:
      tags: [Editions]
      summary: Update an edition
      operationId: updateEdition
      parameters:
        - name: editionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditionDetails"
      responses:
        "200":
          description: Edition updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditionDetails"
    delete:
      tags: [Editions]
      summary: Delete an edition
      operationId: deleteEdition
      parameters:
        - name: editionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Edition deleted

  /editions/{editionId}/publish:
    x-router-controller: editionsController
    patch:
      tags: [Editions]
      summary: Publish an edition
      operationId: publishEdition
      parameters:
        - name: editionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Edition published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditionDetails"

  /editions/{editionId}/methodology:
    x-router-controller: editionsController
    get:
      tags: [Editions]
      summary: Get methodology format of an edition
      operationId: getEditionMethodology
      parameters:
        - name: editionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Edition methodology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Methodology"

  /hackathons:
    x-router-controller: hackathonsController
    get:
      security: [{}]
      tags: [Hackathons]
      summary: Get hackathons
      operationId: getHackathons
      parameters:
        - name: filter
          in: query
          required: true
          schema:
            type: string
            enum: [closest, incoming, previous, all]
      responses:
        "200":
          description: List of hackathons
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HackathonList"
                  - $ref: "#/components/schemas/Hackathon"
        default:
          description: Unexpected error

    post:
      tags: [Hackathons]
      summary: Create a new hackathon
      operationId: createHackathon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Hackathon"
      responses:
        "201":
          description: Hackathon created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hackathon"

  /hackathons/{hackathonId}:
    x-router-controller: hackathonsController
    get:
      tags: [Hackathons]
      summary: Get details of a hackathon
      operationId: getHackathonDetails
      parameters:
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Hackathon details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hackathon"
        "401":
          $ref: '#/components/responses/UnauthorisedError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    put:
      tags: [Hackathons]
      summary: Update a hackathon
      operationId: updateHackathon
      parameters:
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Hackathon"
      responses:
        "200":
          description: Hackathon updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hackathon"
    delete:
      tags: [Hackathons]
      summary: Delete a hackathon
      operationId: deleteHackathon
      parameters:
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Hackathon deleted

  /hackathons/{hackathonId}/publish:
    x-router-controller: hackathonsController
    patch:
      tags: [Hackathons]
      summary: Publish a hackathon
      operationId: publishHackathon
      parameters:
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Hackathon published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hackathon"

  /hackathons/{hackathonId}/users:
    x-router-controller: hackathonsController
    get:
      tags: [Hackathons]
      summary: Get users of a hackathon
      operationId: getHackathonUsers
      parameters:
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserList"

  /hackathons/{hackathonId}/clusters:
    x-router-controller: clustersController
    get:
      tags: [Clusters]
      summary: Get clusters of a hackathon
      operationId: getHackathonClusters
      parameters:
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of clusters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClusterList"
    post:
      tags: [Clusters]
      summary: Create a new cluster
      operationId: createCluster
      parameters:
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Cluster created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"

  /hackathons/{hackathonId}/clusters/{clusterId}:
    x-router-controller: clustersController
    get:
      tags: [Clusters]
      summary: Get details of a cluster
      operationId: getClusterDetails
      parameters:
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cluster details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
    delete:
      tags: [Clusters]
      summary: Delete a cluster
      operationId: deleteCluster
      parameters:
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Cluster deleted

  /hackathons/{hackathonId}/clusters/{clusterId}/exploring-groups:
    x-router-controller: groupsAndTeamsController
    get:
      tags: [Groups & Teams]
      summary: Get exploring groups of a cluster
      operationId: getClusterExploringGroups
      parameters:
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of exploring groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupList"
    post:
      tags: [Groups & Teams]
      summary: Create a new exploring group
      operationId: createExploringGroup
      parameters:
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Exploring group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetails"

  /hackathons/{hackathonId}/clusters/{clusterId}/exploring-groups/{groupId}:
    x-router-controller: groupsAndTeamsController
    get:
      tags: [Groups & Teams]
      summary: Get details of an exploring group
      operationId: getExploringGroupDetails
      parameters:
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Exploring group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetails"
    delete:
      tags: [Groups & Teams]
      summary: Delete an exploring group
      operationId: deleteExploringGroup
      parameters:
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Exploring group deleted
    put:
      tags: [Groups & Teams]
      summary: Update an exploring group
      operationId: updateExploringGroup
      parameters:
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupDetails"
      responses:
        "200":
          description: Exploring group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetails"

  /hackathons/{hackathonId}/clusters/{clusterId}/co-creation-teams:
    x-router-controller: groupsAndTeamsController
    get:
      tags: [Groups & Teams]
      summary: Get co-creation teams of a cluster
      operationId: getClusterCoCreationTeams
      parameters:
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of co-creation teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamList"
    post:
      tags: [Groups & Teams]
      summary: Create a new co-creation team
      operationId: createCoCreationTeam
      parameters:
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Co-creation team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetails"

  /hackathons/{hackathonId}/clusters/{clusterId}/co-creation-teams/{teamId}:
    x-router-controller: groupsAndTeamsController
    get:
      tags: [Groups & Teams]
      summary: Get details of a co-creation team
      operationId: getCoCreationTeamDetails
      parameters:
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Co-creation team details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetails"
    delete:
      tags: [Groups & Teams]
      summary: Delete a co-creation team
      operationId: deleteCoCreationTeam
      parameters:
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Co-creation team deleted
    put:
      tags: [Groups & Teams]
      summary: Update a co-creation team
      operationId: updateCoCreationTeam
      parameters:
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamDetails"
      responses:
        "200":
          description: Co-creation team updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetails"

  /users/{userId}/hackathons:
    x-router-controller: userHackathonsController
    get:
      tags: [User Hackathons]
      summary: Get hackathons in which a user is enrolled
      operationId: getUserEnrolledHackathons
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of hackathons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HackathonList"

  /hackathons/{hackathonId}/participants/me:
    x-router-controller: userHackathonsController
    post:
      tags: [User Hackathons]
      summary: Join the current user to a hackathon
      operationId: joinMeHackathon
      parameters:
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HackathonJoinRequest"
      responses:
        "201":
          description: Enrollment created
        "404":
          description: Resource not found
        default:
          description: Unexpected error

  /hackathons/{hackathonId}/participants/{userId}:
    x-router-controller: userHackathonsController
    post:
      tags: [User Hackathons]
      summary: Join a user to a hackathon
      operationId: joinHackathon
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HackathonJoinRequest"
      responses:
        "201":
          description: Enrollment created

  /users/{userId}/hackathons/{hackathonId}/contributions:
    x-router-controller: userHackathonsController
    get:
      tags: [User Hackathons]
      summary: Get user's contributions in a hackathon
      operationId: getUserHackathonContributions
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User's contributions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contribution"

  /users/{userId}/hackathons/{hackathonId}/clusters/{clusterId}:
    x-router-controller: userHackathonsController
    post:
      tags: [User Hackathons]
      summary: Join a cluster
      operationId: joinCluster
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: hackathonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Cluster enrollment created

  /login:
    x-router-controller: authController
    post:
      security: [{}]
      tags: [Auth]
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Login successful
        default:
          description: Unexpected error

  /register:
    x-router-controller: authController
    get:
      security: [{}]
      tags: [Auth]
      summary: Register a new user (using provider)
      operationId: registerProvider
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum: [google]
      responses:
        "201":
          description: User registered
        default:
          description: Unexpected error
    post:
      security: [{}]
      tags: [Auth]
      summary: Register a new user
      operationId: register
      parameters:
        - name: method
          in: query
          required: true
          schema:
            type: string
            enum: [direct, quick]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "#/components/schemas/SignUpRequest"
                - $ref: "#/components/schemas/QuickSignUpRequest"
      responses:
        "201":
          description: User registered
        default:
          description: Unexpected error

  /register/complete:
    x-router-controller: authController
    post:
      security: [{}]
      tags: [Auth]
      summary: Complete registration
      operationId: completeRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteSignUpRequest"
      responses:
        "201":
          description: Registration completed successfully
        default:
          description: Unexpected error

  /early-signups/{earlySignupId}:
    x-router-controller: authController
    get:
      security: [{}]
      tags: [Auth]
      summary: Get pre-registration details
      operationId: getEarlySignup
      responses:
        "200":
          description: Pre-registration details
        default:
          description: Unexpected error

  /users:
    x-router-controller: usersController
    get:
      tags: [User Profile]
      summary: Get list of users
      operationId: getUsers
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserList"
    post:
      tags: [User Profile]
      summary: Create a new user
      operationId: createUser
      parameters:
        - name: roles
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
              enum:
                [
                  participant,
                  designer,
                  facilitator,
                  inspiring-scientist,
                  evaluator,
                  admin,
                ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDetails"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetails"

  /users/{userId}:
    x-router-controller: usersController
    get:
      tags: [User Profile]
      summary: Get user information
      operationId: getUserInfo
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Public info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetails"
    put:
      tags: [User Profile]
      summary: Edit user profile
      operationId: editUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDetails"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetails"

  /users/{userId}/liked-seeds:
    x-router-controller: userPreferencesController
    get:
      tags: [User Preferences]
      summary: Get liked seeds by edition
      operationId: getLikedSeedsOfUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: edition
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of liked seeds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedList"

    post:
      tags: [User Preferences]
      summary: Like a seed
      operationId: likeSeed
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                seedId:
                  type: integer
      responses:
        "201":
          description: Seed liked

  /users/{userId}/liked-seeds/{seedId}:
    x-router-controller: userPreferencesController
    delete:
      tags: [User Preferences]
      summary: Unlike a seed
      operationId: unlikeSeed
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: seedId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Seed unliked

  /me:
    x-router-controller: usersController
    get:
      tags: [User Profile]
      summary: Get authenticated user
      operationId: getCurrentUser
      responses:
        "200":
          description: My user details
          content:
            application/json:
