components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    UnexpectedError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorisedError:
      description: Unauthorised
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    EditionDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minimum: 1
        name:
          type: string
          maxLength: 50
        logo:
          type: string
          format: uri
        year:
          type: integer
          minimum: 1900
          maximum: 2200
        shortDescription:
          type: string
          maxLength: 255
        longDescription:
          type: string
          maxLength: 500
        catalogLink:
          type: string
          format: uri
        isVisible:
          type: boolean

    EditionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minimum: 1
        name:
          type: string
          maxLength: 50
        logo:
          type: string
          format: uri
        fruitLogo:
          type: string
          format: uri
        year:
          type: integer
          minimum: 1900
          maximum: 2200

    EditionList:
      type: array
      items:
        $ref: "#/components/schemas/EditionSummary"

    Methodology:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        objective:
          type: string
          maxLength: 1000
        mainImg:
          type: string
          format: uri
        sections:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                maxLength: 50
              content:
                type: string
                maxLength: 500
              img:
                type: string
                format: uri

    SeedDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minimum: 1
        name:
          type: string
          maxLength: 255
        templateLink:
          type: string
          format: uri
          nullable: true
        imageLink:
          type: string
          format: uri
          nullable: true
        state:
          type: string
          enum: [IN_BLANK, IN_PROGRESS, IN_REVIEW, PUBLISHED]
        branchesOfKnowledge:
          type: array
          items:
            type: string
            maxLength: 50
          nullable: true
        videoLink:
          type: string
          format: uri
          nullable: true
        presentationLink:
          type: string
          format: uri
          nullable: true
        podcastLink:
          type: string
          format: uri
          nullable: true
        resourcesLink:
          type: string
          format: uri
          nullable: true
        authors:
          type: array
          items:
            $ref: "#/components/schemas/UserDetails"
          nullable: true
        editionId:
          type: string
          format: uuid
          minimum: 1
        likeCount:
          type: integer
          minimum: 0
          nullable: true

    FlowerDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minimum: 1
        name:
          type: string
          maxLength: 255
        templateLink:
          type: string
          format: uri
        state:
          type: string
          enum: [IN_BLANK, IN_PROGRESS, IN_REVIEW, PUBLISHED]
        concept:
          type: string
          maxLength: 1500
          nullable: true
        resourcesLink:
          type: string
          format: uri
        seedId:
          type: string
          format: uuid
          minimum: 1
        authors:
          type: array
          items:
            $ref: "#/components/schemas/UserDetails"
        hackathonId:
          type: string
          format: uuid
          minimum: 1

    FruitDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minimum: 1
        title:
          type: string
          maxLength: 255
        mainImage:
          type: string
          format: uri
          nullable: true
        state:
          type: string
          enum: [IN_BLANK, IN_PROGRESS, IN_REVIEW, PUBLISHED]
        authorVision:
          type: string
          maxLength: 1500
          nullable: true
        curatorVision:
          type: string
          maxLength: 1500
          nullable: true
        driveLink:
          type: string
          format: uri
          nullable: true
        flowerId:
          type: string
          format: uuid
          nullable: true

    UserDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minimum: 1
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 50
        surname:
          type: string
          maxLength: 50
        password:
          type: string
          format: password
        gender:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date

    UserList:
      type: array
      items:
        $ref: "#/components/schemas/UserDetails"

    SeedList:
      type: array
      items:
        $ref: "#/components/schemas/SeedDetails"

    FlowerList:
      type: array
      items:
        $ref: "#/components/schemas/FlowerDetails"

    FruitList:
      type: array
      items:
        $ref: "#/components/schemas/FruitDetails"

    Hackathon:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minimum: 1
        logo:
          type: string
          format: uri
          nullable: true
        startDate:
          type: object
          nullable: true
        endDate:
          type: object
          nullable: true
        type:
          type: string
          enum: [ON_SITE, ONLINE, HYBRID]
        location:
          type: string
          maxLength: 255
          nullable: true
        description:
          type: string
          maxLength: 500
          nullable: true
        editionId:
          type: string
          format: uuid
          minimum: 1
        isVisible:
          type: boolean
        meetLink:
          type: string
          format: uri
          nullable: true

    HackathonList:
      type: array
      items:
        $ref: "#/components/schemas/Hackathon"

    Contribution:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minimum: 1
        conceptualMapId:
          type: string
          format: uuid
          minimum: 1
        flower:
          $ref: "#/components/schemas/FlowerDetails"
        fruit:
          $ref: "#/components/schemas/FruitDetails"

    ConceptualMap:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minimum: 1
        link:
          type: string
          format: uri
        seedId:
          type: string
          format: uuid
          minimum: 1
        authors:
          type: array
          items:
            $ref: "#/components/schemas/UserDetails"

    DomainItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minimum: 1
        name:
          type: string
          maxLength: 50

    DomainItemList:
      type: array
      items:
        $ref: "#/components/schemas/DomainItem"

    Cluster:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minimum: 1

    ClusterList:
      type: array
      items:
        $ref: "#/components/schemas/Cluster"

    GroupDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minimum: 1
        clusterId:
          type: string
          format: uuid
          minimum: 1
        seedId:
          type: string
          format: uuid
          minimum: 1
        conceptualMapId:
          type: string
          format: uuid
          minimum: 1

    GroupList:
      type: array
      items:
        $ref: "#/components/schemas/GroupDetails"

    TeamDetails:
