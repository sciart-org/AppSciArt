EditionDetails:
  type: object
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      maxLength: 50
    logo:
      type: string
      format: uri
      nullable: true
    year:
      type: integer
      minimum: 1900
      maximum: 2200
    longDescription:
      type: string
      nullable: true
    catalogLink:
      type: string
      format: uri
      nullable: true
    state:
      type: string
      enum: [PLANNED, ACTIVE, CLOSED, PUBLISHED]

EditionSummary:
  type: object
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      maxLength: 50
    logo:
      type: string
      format: uri
      nullable: true
    fruitLogo:
      type: string
      format: uri
    year:
      type: integer
      minimum: 1900
      maximum: 2200
    shortDescription:
      type: string
      maxLength: 255
      nullable: true
    state:
      type: string
      enum: [PLANNED, ACTIVE, CLOSED, PUBLISHED]

EditionList:
  type: array
  items:
    $ref: "#/EditionSummary"

Methodology:
  type: object
  properties:
    name:
      type: string
      maxLength: 50
    objective:
      type: string
      maxLength: 1000
    mainImg:
      type: string
      format: uri
    sections:
      type: array
      items:
        type: object
        properties:
          title:
            type: string
            maxLength: 50
          content:
            type: string
            maxLength: 500
          img:
            type: string
            format: uri
