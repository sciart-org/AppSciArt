FruitDetails:
  type: object
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
      maxLength: 255
    mainImage:
      type: string
      format: uri
      nullable: true
    state:
      type: string
      enum: [IN_BLANK, IN_PROGRESS, IN_REVIEW, PUBLISHED]
    authorVision:
      type: string
      maxLength: 1500
      nullable: true
    curatorVision:
      type: string
      maxLength: 1500
      nullable: true
    driveLink:
      type: string
      format: uri
      nullable: true
    flowerId:
      type: string
      format: uuid
      nullable: true

FruitList:
  type: array
  items:
    $ref: "#/FruitDetails"
