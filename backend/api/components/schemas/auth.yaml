SignUpRequest:
  type: object
  required: [email, name, surname, password]
  properties:
    email:
      type: string
      format: email
    name:
      type: string
      maxLength: 50
    surname:
      type: string
      maxLength: 50
    password:
      type: string
      format: password
    gender:
      type: string
      nullable: true
    ageRange:
      type: string
      nullable: true
    affiliations:
      type: array
      nullable: true
      items:
        type: string
        maxLength: 50
    areasOfInterest:
      type: array
      nullable: true
      items:
        type: string
        maxLength: 50

