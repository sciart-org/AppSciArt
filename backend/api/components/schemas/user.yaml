UserDetails:
  type: object
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      pattern: '^[a-zA-Z0-9._%+-ñÑáéíóúüÁÉÍÓÚÜ]+@[a-zA-Z0-9.-ñÑáéíóúüÁÉÍÓÚÜ]+\.[a-zA-Z]{2,}$'
    name:
      type: string
      maxLength: 50
    surname:
      type: string
      maxLength: 50
    password:
      type: string
      format: password
    gender:
      type: string
      nullable: true
    birthDate:
      type: string
      format: date

UserList:
  type: array
  items:
    $ref: "#/UserDetails"
